services:
  - type: web
    name: finova-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: finova
      - key: FRONTEND_URL
        value: "*"
      - key: ALLOW_OFFLINE_FALLBACK
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
